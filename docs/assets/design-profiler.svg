<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Profiler data flow</title>
  <desc id="desc">Program context and IR records combine with optional vendor metrics to produce call trees, timelines, and metrics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>
  <polyline points="170,92 170,126 420,126 420,156" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="500,92 500,156" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="420,216 420,246 170,246 170,280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="500,216 500,280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="580,216 580,246 830,246 830,280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="830,92 830,126 580,126 580,156" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
  <g id="context">
    <rect x="40" y="32" width="260" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <text x="170" y="62" dy="0.35em" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#202020">Program Context</text>
  </g>
  <g id="records">
    <rect x="370" y="32" width="260" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <text x="500" y="62" dy="0.35em" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#202020">IR Records</text>
  </g>
  <g id="vendor">
    <rect x="700" y="32" width="260" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <text x="830" y="62" dy="0.35em" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#202020">Vendor Metrics</text>
  </g>
  <g id="aggregation">
    <rect x="370" y="156" width="260" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <text x="500" y="186" dy="0.35em" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#202020">Aggregation</text>
  </g>
  <g id="tree">
    <rect x="40" y="280" width="260" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <text x="170" y="310" dy="0.35em" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#202020">Call Tree</text>
  </g>
  <g id="timeline">
    <rect x="370" y="280" width="260" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <text x="500" y="310" dy="0.35em" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#202020">Timeline</text>
  </g>
  <g id="metrics">
    <rect x="700" y="280" width="260" height="60" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <text x="830" y="310" dy="0.35em" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#202020">Metrics</text>
  </g>
</svg>
